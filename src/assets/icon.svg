<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F24"/>
      <stop offset="100%" stop-color="#0E0E11"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF"/>
      <stop offset="50%" stop-color="#468CF6"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"/>

  <!-- Glowing Sound Waveform Bars -->
  <g filter="url(#glow)" fill="url(#waveGrad)">
    <!-- Bar 1 -->
    <rect x="96" y="216" width="28" height="80" rx="14" />
    <!-- Bar 2 -->
    <rect x="144" y="166" width="28" height="180" rx="14" />
    <!-- Bar 3 -->
    <rect x="192" y="116" width="28" height="280" rx="14" />
    <!-- Bar 4 (Center Hero) -->
    <rect x="242" y="76" width="28" height="360" rx="14" />
    <!-- Bar 5 -->
    <rect x="292" y="126" width="28" height="260" rx="14" />
    <!-- Bar 6 -->
    <rect x="340" y="176" width="28" height="160" rx="14" />
    <!-- Bar 7 -->
    <rect x="388" y="226" width="28" height="60" rx="14" />
  </g>

  <!-- Central Dynamic Pulse Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.3" stroke-dasharray="12 16" />
</svg>
