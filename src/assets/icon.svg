<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="100%" stop-color="#0E0E11"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.10)" stroke-width="4"/>

  <!-- 5-Bar Neon Blue Soundwave (Matching Screenshot) -->
  <g filter="url(#neonGlow)" fill="url(#neonBlue)">
    <!-- Bar 1 (Left Short) -->
    <rect x="87" y="196" width="42" height="120" rx="21" />
    <!-- Bar 2 (Mid-Left) -->
    <rect x="161" y="136" width="42" height="240" rx="21" />
    <!-- Bar 3 (Center Hero) -->
    <rect x="235" y="76" width="42" height="360" rx="21" />
    <!-- Bar 4 (Mid-Right) -->
    <rect x="309" y="136" width="42" height="240" rx="21" />
    <!-- Bar 5 (Right Short) -->
    <rect x="383" y="196" width="42" height="120" rx="21" />
  </g>
</svg>
