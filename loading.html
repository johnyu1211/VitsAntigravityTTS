<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Antigravity Voice Studio - Starting</title>
  <style>
    body {
      background-color: #1c1c1e;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      text-align: center;
      background: #2c2c2e;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 16px;
      padding: 36px 44px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      min-width: 320px;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      color: #8E8E93;
      font-size: 13px;
      margin: 0 0 20px 0;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(70, 140, 246, 0.2);
      border-top-color: #468CF6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    .sec-badge {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Antigravity Voice Studio</h2>
    <p id="statusMsg">Loading AI models into GPU VRAM...</p>
    <div class="spinner"></div>
    <div class="sec-badge" id="secBadge">Starting engine...</div>
  </div>

  <script>
    let elapsed = 0;
    const secBadge = document.getElementById('secBadge');
    const statusMsg = document.getElementById('statusMsg');

    setInterval(() => {
      elapsed++;
      secBadge.innerText = `Connecting (${elapsed}s)`;
      if (elapsed > 4) {
        statusMsg.innerText = 'Initializing neural vocoder & weights...';
      }
    }, 1000);
  </script>
</body>
</html>
